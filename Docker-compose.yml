version: "3.9"

networks:
  codesparrow-net:
    driver: bridge

volumes:
  auth-target:
  dashboard-target:

services:
  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./backend/AuthService:/app
      - auth-target:/app/target
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codesparrow-net

  dashboard-service:
    build:
      context: ./backend/DashboardService
      dockerfile: Dockerfile
    container_name: dashboard-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    volumes:
      - ./backend/DashboardService:/app
      - dashboard-target:/app/target
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codesparrow-net

  frontend:
    build:
      context: ./Core/Core.Fontend/CodeSparrow-Core
      dockerfile: Dockerfile
    container_name: codesparrow-frontend
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./Core/Core.Fontend/CodeSparrow-Core:/app
      - /app/node_modules
    networks:
      - codesparrow-net

  nginx:
    image: nginx:alpine
    container_name: codesparrow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - dashboard-service
    networks:
      - codesparrow-net