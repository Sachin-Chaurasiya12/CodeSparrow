version: "3.9"

networks:
  codesparrow-net:
    driver: bridge

services:
  auth-service:
    build:
      context: ./backend/AuthService
      dockerfile: Dockerfile
    container_name: auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/codesparrow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: fycs
      # SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codesparrow-net

  dashboard-service:
    build:
      context: ./backend/DashboardService
      dockerfile: Dockerfile
    container_name: dashboard-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # SPRING_DATASOURCE_URL: jdbc:mysql://host.docker.internal:3306/codesparrow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      # SPRING_DATASOURCE_USERNAME: root
      # SPRING_DATASOURCE_PASSWORD: fycs
      # SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - codesparrow-net

  frontend:
    build:
      context: ./Core/Core.Fontend/CodeSparrow-Core
      dockerfile: Dockerfile
    container_name: codesparrow-frontend
    restart: unless-stopped
    networks:
      - codesparrow-net

  nginx:
    image: nginx:alpine
    container_name: codesparrow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - auth-service
      - dashboard-service
    networks:
      - codesparrow-net