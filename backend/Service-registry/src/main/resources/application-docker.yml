server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  instance:
    hostname: service-registry

  client:
    register-with-eureka: false
    fetch-registry: false

    service-url:
      defaultZone: http://service-registry:8761/eureka/

  server:
    wait-time-in-ms-when-sync-empty: 0